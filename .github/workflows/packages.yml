name: Build release packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        default: all
        options: [all, linux, windows]
      linux_artifact_run:
        description: Reuse a Linux package artifact for a graphical smoke test
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-24.04"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["windows-latest","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system libraries and packager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb gnome-keyring dbus-x11
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress --limit-output
      - name: Install Rust
        if: inputs.linux_artifact_run == ''
        run: rustup update stable --no-self-update
      - name: Compile
        if: inputs.linux_artifact_run == ''
        run: cargo build --locked --release --bins
      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "-DBUILD_DIR=$env:GITHUB_WORKSPACE\target\release" tools\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          ./tools/package.ps1 -SkipBuild
      - name: Reuse Linux package
        if: runner.os == 'Linux' && inputs.linux_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.linux_artifact_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$SOURCE_RUN" --name desktop-packages-Linux --dir "$RUNNER_TEMP/package-download"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          package=$(find "$RUNNER_TEMP/package-download" -type f -name "Whakoom-Desktop-$version-x86_64.AppImage" -print -quit)
          test -s "$package"
          mkdir -p dist
          cp "$package" "dist/Whakoom-Desktop-$version-x86_64.AppImage"
      - name: Linux AppImage and interface smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SOURCE_RUN: ${{ inputs.linux_artifact_run }}
        run: |
          if [ -z "$SOURCE_RUN" ]; then
            bash tools/package-linux.sh --skip-build
            export APP_BINARY="$PWD/target/release/whakoom-desktop"
          else
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            export APP_BINARY="$PWD/dist/Whakoom-Desktop-$version-x86_64.AppImage"
            chmod +x "$APP_BINARY"
            export APPIMAGE_EXTRACT_AND_RUN=1
          fi
          export WHAKOOM_DESKTOP_DATA_DIR="$RUNNER_TEMP/smoke-data"
          export XDG_DATA_HOME="$RUNNER_TEMP/keyring-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/keyring-runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -c '
            printf "%s" "isolated-smoke-fixture" | gnome-keyring-daemon --unlock
            timeout 90s xvfb-run -a "$APP_BINARY" --offline --headless-preview --preview-visible --preview-account-sync --preview-size 1280x1440 --smoke "$RUNNER_TEMP/account-sync.png"
            timeout 90s xvfb-run -a "$APP_BINARY" --offline --headless-preview --preview-visible --preview-suggestion --preview-size 1280x900 --smoke "$RUNNER_TEMP/suggestion.png"
          '
          test -s "$RUNNER_TEMP/account-sync.png"
          test -s "$RUNNER_TEMP/suggestion.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-packages-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && always()
        with:
          name: package-preview-Linux
          if-no-files-found: ignore
          path: ${{ runner.temp }}/*.png
