name: Build release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux system libraries and packager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress --limit-output
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Compile
        run: cargo build --locked --release --bins
      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "-DBUILD_DIR=$env:GITHUB_WORKSPACE\target\release" tools\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          ./tools/package.ps1 -SkipBuild
      - name: Linux AppImage and interface smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          bash tools/package-linux.sh --skip-build
          export WHAKOOM_DESKTOP_DATA_DIR="$RUNNER_TEMP/smoke-data"
          timeout 40s xvfb-run -a target/release/whakoom-desktop --offline --headless-preview --preview-account-sync --preview-size 1280x1440 --smoke "$RUNNER_TEMP/account-sync.png"
          test -s "$RUNNER_TEMP/account-sync.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-packages-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/SHA256SUMS.txt
            ${{ runner.temp }}/account-sync.png
