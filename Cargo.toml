[package]
name = "whakoom-desktop"
version = "3.1.0"
edition = "2024"
rust-version = "1.95"
description = "Cliente de escritorio no oficial de Whakoom, escrito en Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls-native-roots", "system-proxy", "cookies", "gzip"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
url = "2"
webbrowser = "1"
zeroize = "1"
sha2 = "0.10"
rfd = "0.15"
tiny-skia = "0.11"
tempfile = "3"
base64 = "0.22"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
read-fonts = "0.41"

[target.'cfg(windows)'.dependencies]
wry = { version = "0.55.1", default-features = false, features = ["os-webview"] }
windows-sys = { version = "0.60.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "whakoom-desktop"
path = "src/main.rs"

[[bin]]
name = "whakoom-check"
path = "src/bin/check.rs"
